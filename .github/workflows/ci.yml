name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: titipsandi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d titipsandi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/titipsandi_test
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/titipsandi_test
      JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      ENCRYPTION_KEY_PREVIOUS: ""
      ENCRYPTION_WRITE_VERSION: v1
      WEBAUTHN_ORIGIN: https://titipsandi.test
      WEBAUTHN_RP_ID: titipsandi.test

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Run quality checks
        run: npm run check

      - name: Run PostgreSQL integration tests
        env:
          RUN_DATABASE_TESTS: "1"
        run: >-
          npm run test --
          src/lib/rate-limit.integration.test.ts
          src/lib/key-rotation.integration.test.ts

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build production application
        run: npm run build
